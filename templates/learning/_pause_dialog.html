{% load i18n %}<dialog class="modal" id="pause-{{ topic.pk }}">
  <form class="modal-body" method="post" action="{% url 'learning:pause' topic.slug %}">{% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <div style="font-size:2.4rem">⏸️</div>
    <h3 style="font-size:1.35rem">{% translate "Take a break — we'll remind you" %}</h3>
    <p class="muted small">{% translate "Your progress is saved. Choose when you want to come back to:" %} <b>{{ topic.title }}</b></p>
    <div class="quick-times">
      <button type="button" data-quick="evening">🌙 {% translate "This evening" %}</button>
      <button type="button" data-quick="tomorrow">☀️ {% translate "Tomorrow" %}</button>
      <button type="button" data-quick="3days">📆 {% translate "In 3 days" %}</button>
    </div>
    <div class="field"><label>{% translate "Or pick date and time" %}</label><input type="datetime-local" name="remind_at" data-min-now required></div>
    <div class="row" style="justify-content:flex-end">
      <button type="button" class="btn btn-ghost" data-dialog-close>{% translate "Cancel" %}</button>
      <button type="submit" class="btn btn-primary">🔔 {% translate "Set reminder" %}</button>
    </div>
  </form>
</dialog>
